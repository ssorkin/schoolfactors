[project]
name = "schoolfactors"
version = "0.1.0"
description = "Open repository and analysis of California public-education data (CAASPP, CDE)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Stephen Sorkin", email = "ssorkin@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.17",
    "pandas>=2.2",
    "pyarrow>=18",
    "statsmodels>=0.14",
    "scipy>=1.14",
    "numpy>=2",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "openpyxl>=3.1",
    "pyyaml>=6",
    "typer>=0.15",
    "rich>=13",
    "matplotlib>=3.11.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
sf = "schoolfactors.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schoolfactors"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
