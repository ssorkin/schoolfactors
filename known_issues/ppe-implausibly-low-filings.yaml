id: ppe-implausibly-low-filings
dataset: ppe
years: [2024, 2025]
kind: reporting-inconsistency
title: Some LEAs filed implausibly low ESSA PPE — state/local dollars missing
description: >
  Nine LEAs (93 school rows, ~66,000 students) filed 2024-25 ESSA per-pupil
  expenditures with a median total under $5,000/pupil — below the LCFF base grant
  alone, and impossible as a real total. Mt. Diablo Unified is the largest clear
  case: every one of its 50 schools reports near-zero state/local dollars (max
  $487/pupil district-wide, central $0), leaving only stray federal amounts —
  e.g. Mt. Diablo High at $1,084/pupil. Prior years show the filing decayed:
  Mt. Diablo High totaled roughly $27k/pupil through 2022-23, then $2.7k in
  2023-24 and $1.1k in 2024-25. Sweetwater Union High ($4,038 median across 29
  schools) is the other large affected LEA. A further 108 individual school rows
  fall under $5,000 inside otherwise-normal LEAs.
evidence: >
  data/raw/ppe/essappe2425data.xlsx — per-LEA medians for Mt. Diablo Unified
  ($333), Sweetwater Union High ($4,038), Sierra Unified ($3,408), and six
  smaller LEAs; compare the same schools' plausible totals in essappe2223data
  and earlier files.
handling: >
  Named transform in analysis/export.py alongside the totals-reporter
  normalization: an LEA whose median reported value is under $5,000/pupil is
  treated as a broken filing and ALL of its rows are dropped (a broken LEA's
  individually-plausible rows are not trusted either). Independently, any row
  under $5,000/pupil after normalization is dropped. (The upper bound is
  $500,000: legitimately expensive tiny SpEd/court/community-day programs
  reach $150k-$400k per pupil and are kept.) Affected schools and
  districts show no per-pupil spending rather than a wrong number; no
  substitution from prior years is attempted.
