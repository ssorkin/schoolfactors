id: cde-virtual-flag-lower-bound
dataset: directory
years: [2005, 2026]
kind: coverage-limitation
title: Directory virtual flag is present-day and undercounts non-classroom-based enrollment
description: >
  The statewide enrollment-flow model classifies a school as virtual when the CDE
  directory currently flags it fully or primarily virtual (virtual in F/V). Two
  limitations follow. (1) The flag is a present-day attribute applied to the whole
  1981-2026 enrollment history: schools that changed model, or closed before the
  flag existed, are classified by their last-known state. (2) Non-classroom-based
  charters that CDE does not flag virtual (independent-study, hybrid,
  resource-center models) are treated as physical schools at their directory
  coordinates even though their students need not live nearby. Both push in the
  same direction: the statewide virtual pool is a LOWER BOUND, and the flow model
  attributes some genuinely-remote enrollment to the school's host area, biasing
  that area toward apparent net import (and the students' home areas toward
  apparent export).
evidence: >
  Flagged-virtual statewide enrollment: 37k (2015) -> 103k (2023) -> 135k
  (2025-26), while county-level reconciliation shows out-of-county administrative
  enrollment concentrated in known non-classroom-based authorizer counties (Inyo
  -38%, Sutter -28%, Glenn -24% at vintage 2023 - analysis/
  residual_reconciliation.md), magnitudes the flag alone does not reach.
handling: >
  Documented in analysis/enrollment_flow_model.md and on the site methodology
  page; remote-pool quantities are labeled estimates and the flag's lower-bound
  nature is stated wherever the remote share is shown. The flag is complemented
  by an arithmetic criterion (enrollment_flows NC_RATIO): charters whose
  geographic authorizer's administered charter enrollment exceeds 1.5x the
  authorizer's own resident children are classified non-classroom statewide-draw
  and pooled with flagged-virtual seats (allocated over the authorizer county +
  adjacent counties, the Ed Code enrollment footprint; audited per vintage in
  the DQ report). The criterion is itself a lower bound: non-classroom programs
  under large authorizers pass the ratio test and remain in measured
  cross-county flows. No name-matching heuristics are applied - that would
  silently patch data. A future improvement is CDE's non-classroom-based
  funding determination list, which is not currently acquired.
