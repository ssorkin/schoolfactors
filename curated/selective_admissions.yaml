# Schools with selective (exam/criteria-based) or application-gated admissions.
#
# CDE publishes NO field for this — verified: Whitney (Gretchen) High and Oxford
# Academy, both exam-entry, are Magnet=N/Charter=N/EdOps=Traditional in the public
# schools directory. This list is therefore community-curated, with a source per
# entry. It is deliberately conservative: only schools whose admission process is
# publicly documented. Corrections and additions welcome via pull request.
#
# kind: exam      — admission requires an entrance exam / test-score criteria
#       criteria  — application with academic or audition criteria (no open lottery)
#       lottery+  — application-based with weighted lottery and eligibility criteria

