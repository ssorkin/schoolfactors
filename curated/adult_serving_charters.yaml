# Charter schools serving predominantly ADULT (18+) students while reporting
# census-day enrollment in K-12 grade categories.
#
# CDE publishes NO per-school age mix, so these cannot be detected from the
# data files alone; the statewide enrollment-flow model needs them because
# their students sit outside the ACS resident-children (5-17) universe — left
# in, their seats read as phantom net IMPORT at their administrative county
# (the flow model's conservation decomposition surfaced exactly these
# counties as unexplained importers). The list is deliberately conservative:
# only programs whose adult-serving mission is publicly documented, with a
# source per entry. Corrections and additions welcome via pull request.
#
# Treatment in the flow model: excluded from the resident-children accounting
# entirely (from physical seats, from the remote pool, and from the statewide
# universe calibration) — not pooled, because pooling would allocate adult
# seats against child residents.

- cds: "34765050130757"
  name: Highlands Community Charter
  district: Twin Rivers Unified
  note: >
    Adult-serving charter (students 22+ under EC 47612.1 exemption claims);
    subject of 2024-25 state audit and legislation (AB 1955 context) over
    thousands of adult enrollees reported as TK-12.
  source: https://www.auditor.ca.gov/reports/2024-107/index.html

- cds: "38684780118141"
  name: Five Keys Independence HS (SF Sheriff's)
  district: San Francisco Unified
  note: >
    In-custody and reentry adult education charter operating in county jails
    and community sites statewide; students are overwhelmingly adults.
  source: https://www.fivekeys.org/about

- cds: "38684780101774"
  name: Five Keys Charter (SF Sheriff's)
  district: San Francisco Unified
  note: Sister school of Five Keys Independence; same adult in-custody model.
  source: https://www.fivekeys.org/about

